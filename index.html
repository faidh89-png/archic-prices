<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أسعار آرتشيك">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>أسعار آرتشيك</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a showroom counter tool — fast, calm, no decoration
   IDEA: the printed price tag on a shop shelf
   PICTURE: the live camera window with a scan line, then the price tag
   COLOUR and TYPE: white ground, ink, deep teal #0b5d63; IBM Plex Sans Arabic
   LAYOUT: one column, thumb-reachable button, camera, tag, search */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1416);--ink:light-dark(#14161a,#eef2f2);--mut:light-dark(#5b6268,#9aa6a8);--line:light-dark(#dfe3e5,#24302f);--acc:light-dark(#0b5d63,#4fb3b9);--accInk:light-dark(#ffffff,#06201f);--tag:light-dark(#f3f7f7,#13201f)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.05;margin:4px 0 4px;font-weight:700}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:68px;border:0;border-radius:14px;background:var(--acc);color:var(--accInk);font:700 20px/1 inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--line);min-height:48px;font-size:16px;margin-top:10px}
.btn svg{width:28px;height:28px;flex:none}
.btn:focus-visible,input:focus-visible,.res button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#photo{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
.cam{position:relative;display:none;margin-top:12px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:22% 10%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ff4d3d}
@media (prefers-reduced-motion:no-preference){.cam .line{animation:s 1.6s ease-in-out infinite alternate}@keyframes s{from{top:26%}to{top:74%}}}
.msg{min-height:24px;margin:10px 2px;color:var(--mut);font-size:15px}
.msg.err{color:light-dark(#a3271c,#ff8a7a)}
.tag{position:relative;margin:8px 0 22px;padding:22px 20px 20px;border:1px solid var(--line);border-radius:16px;background:var(--tag)}
.tag::before{content:"";position:absolute;top:18px;inset-inline-start:18px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.tag .code{font-weight:700;font-size:15px;color:var(--acc);direction:ltr;text-align:end;unicode-bidi:plaintext}
.tag .name{margin:6px 0 14px;font-size:16px;direction:ltr;text-align:start;unicode-bidi:plaintext;overflow-wrap:anywhere}
.tag .price{font-size:clamp(40px,12vw,56px);line-height:1;font-weight:700;white-space:nowrap}
.tag .price small{font-size:20px;font-weight:600;color:var(--mut);margin-inline-start:6px}
.tag .stock{display:flex;align-items:center;justify-content:center;margin-top:16px;min-height:48px;border:1px solid var(--acc);border-radius:12px;color:var(--acc);font-weight:600;text-decoration:none}
.tag.empty{color:var(--mut);text-align:center;padding:30px 20px}
.tag.empty::before{display:none}
@media (prefers-reduced-motion:no-preference){.tag.flash{animation:f .45s ease-out}@keyframes f{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}}
label.lbl{display:block;font-weight:600;margin:0 2px 8px}
input[type=search]{width:100%;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:16px inherit;direction:ltr;text-align:right}
.res{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.res li{border-bottom:1px solid var(--line)}
.res button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;min-height:56px;padding:10px 4px;border:0;background:none;color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.res .c{font-weight:700;direction:ltr;unicode-bidi:plaintext}
.res .p{font-weight:600;white-space:nowrap;text-align:end}
.res .n{grid-column:1/-1;color:var(--mut);font-size:13px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{margin-top:26px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>أسعار آرتشيك</h1>
  <p class="sub">وجّه الكاميرا إلى الباركود ليظهر السعر.</p>

  <button class="btn" id="go" type="button">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 10V6a2 2 0 0 1 2-2h4M22 4h4a2 2 0 0 1 2 2v4M28 22v4a2 2 0 0 1-2 2h-4M10 28H6a2 2 0 0 1-2-2v-4"/><path d="M10 10v12M14 10v12M17 10v12M21 10v12"/></svg>
    <span id="goTxt">ابدأ المسح</span>
  </button>
  <div class="cam" id="cam"><video id="v" playsinline muted></video><div class="frame"></div><div class="line"></div></div>
  <div class="msg" id="msg" aria-live="polite">جاري تحميل الأسعار…</div>

  <section class="tag empty" id="tag" aria-live="polite">السعر يظهر هنا بعد قراءة الباركود.</section>

  <label class="lbl" for="q">بحث بالكود أو الاسم</label>
  <input type="search" id="q" inputmode="search" autocomplete="off" autocapitalize="characters" placeholder="مثال: GU10-7W">
  <ul class="res" id="res"></ul>

  <div class="btn ghost">إذا لم تعمل الكاميرا: صوّر الباركود
    <input type="file" id="photo" accept="image/*" capture="environment" aria-label="صوّر الباركود">
  </div>

  <p class="foot" id="foot">الأسعار بالدينار العراقي.</p>
</main>
<script src="zxing.min.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag = $('tag'), msg = $('msg');
let DATA = [], map = new Map();

function say(t, err){ msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }
function iqd(v){ return v > 0 ? Math.round(v) : 0; }

async function load(){
  try {
    const a = await fetch('items.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json());
    DATA = a.items.map(r => [String(r[0]), String(r[1]), iqd(Number(r[2])), String(r[3] || '')]);
    map = new Map(DATA.map(r => [r[0].toUpperCase(), r]));
    $('foot').textContent = 'الأسعار بالدينار العراقي. آخر تحديث: ' + (a.updated || '');
    say('');
  } catch (e) {
    say('تعذّر تحميل الأسعار. تأكد من الإنترنت ثم أعد فتح الصفحة.', true);
  }
}

function show(r){
  tag.className = 'tag';
  tag.innerHTML = '<div class="code">' + esc(r[0]) + '</div><div class="name">' + esc(r[1]) + '</div>' +
    (r[2] > 0 ? '<div class="price">' + fmt(r[2]) + '<small>د.ع</small></div>' : '<div class="price" style="font-size:24px">السعر غير محدد</div>') +
    (/^\d+$/.test(r[3]) ? '<a class="stock" target="_blank" rel="noopener" href="https://books.zoho.com/app/903193448#/inventory/items/' + r[3] + '">تحقق من العدد في المخزن</a>' : '');
  void tag.offsetWidth; tag.classList.add('flash');
}
function lookup(code){
  const k = String(code || '').trim().toUpperCase();
  const r = map.get(k);
  if (r) { show(r); say(''); return true; }
  tag.className = 'tag empty'; tag.textContent = 'الكود ' + k + ' غير موجود في القائمة.';
  return false;
}

/* live scanning */
let stream = null, reader = null, running = false, last = '', lastAt = 0, timer = 0;
const video = $('v');
function hit(text){
  const now = Date.now();
  if (text === last && now - lastAt < 2500) return;
  last = text; lastAt = now;
  if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
  if (!lookup(text)) say('قُرئ الكود لكنه غير موجود في القائمة.', true);
}
async function startNative(){
  const formats = await BarcodeDetector.getSupportedFormats();
  if (!formats.includes('code_128')) throw new Error('nofmt');
  const det = new BarcodeDetector({formats: ['code_128', 'qr_code', 'ean_13', 'code_39'].filter(f => formats.includes(f))});
  stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
  video.srcObject = stream; await video.play();
  const tick = async () => {
    if (!running) return;
    try { const f = await det.detect(video); if (f.length) hit(f[0].rawValue); } catch (e) {}
    timer = setTimeout(tick, 180);
  };
  tick();
}
async function startZxing(){
  const Z = window.ZXing;
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.EAN_13]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const mfr = new Z.MultiFormatReader(); mfr.setHints(hints);
  stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
  video.srcObject = stream; try { await video.play(); } catch (e) {}
  const c = document.createElement('canvas'), ctx = c.getContext('2d', {willReadFrequently: true});
  const tick = () => {
    if (!running) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      const sw = Math.round(vw * 0.85), sh = Math.round(vh * 0.6), sx = Math.round((vw - sw) / 2), sy = Math.round((vh - sh) / 2);
      const sc = Math.min(1, 1000 / sw);
      c.width = Math.round(sw * sc); c.height = Math.round(sh * sc);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
      try {
        const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));
        hit(mfr.decodeWithState(bmp).getText());
      } catch (e) {} finally { mfr.reset(); }
    }
    timer = setTimeout(tick, 220);
  };
  tick();
}
async function start(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('هذا المتصفح لا يدعم الكاميرا. استخدم زر التصوير في الأسفل.', true); return; }
  running = true; $('cam').classList.add('on'); $('goTxt').textContent = 'إيقاف المسح'; say('وجّه الكاميرا إلى الباركود…');
  try {
    if ('BarcodeDetector' in window) { try { await startNative(); return; } catch (e) { stopStream(); } }
    if (!window.ZXing) throw new Error('nolib');
    await startZxing();
  } catch (e) {
    stop();
    say(e && e.name === 'NotAllowedError' ? 'لم يُسمح باستخدام الكاميرا. اسمح للمتصفح بالكاميرا من الإعدادات ثم حاول مرة أخرى.' : 'تعذّر تشغيل الكاميرا. استخدم زر التصوير في الأسفل.', true);
  }
}
function stopStream(){ if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
function stop(){
  running = false; clearTimeout(timer);
  stopStream(); video.srcObject = null;
  $('cam').classList.remove('on'); $('goTxt').textContent = 'ابدأ المسح';
}
$('go').addEventListener('click', () => running ? stop() : start());
document.addEventListener('visibilitychange', () => { if (document.hidden && running) stop(); });

/* photo fallback */
$('photo').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  say('جاري قراءة الصورة…');
  try {
    const bmp = await createImageBitmap(f);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    let text = '';
    if ('BarcodeDetector' in window) { try { const d = await new BarcodeDetector().detect(c); if (d.length) text = d[0].rawValue; } catch (x) {} }
    if (!text) {
      const Z = window.ZXing, hints = new Map();
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      const img = new Image(); img.src = c.toDataURL('image/jpeg', .92); await img.decode();
      text = (await new Z.BrowserMultiFormatReader(hints).decodeFromImageElement(img)).getText();
    }
    if (!lookup(text)) say('قُرئ الكود لكنه غير موجود في القائمة.', true);
  } catch (x) { say('تعذّرت قراءة الباركود من الصورة. حاول مرة أخرى أو اكتب الكود.', true); }
});

/* search */
const res = $('res'), q = $('q');
function search(){
  const t = q.value.trim().toUpperCase();
  if (!t) { res.innerHTML = ''; return; }
  const hits = [];
  for (const r of DATA) { if (r[0].toUpperCase().startsWith(t)) hits.push(r); if (hits.length >= 30) break; }
  if (hits.length < 30 && t.length >= 2) for (const r of DATA) { if (hits.length >= 30) break; if (!hits.includes(r) && (r[0].toUpperCase().includes(t) || r[1].toUpperCase().includes(t))) hits.push(r); }
  res.innerHTML = hits.length ? hits.map(r => '<li><button type="button" data-k="' + esc(r[0]) + '"><span class="c">' + esc(r[0]) + '</span><span class="p">' +
    (r[2] > 0 ? fmt(r[2]) + ' د.ع' : '—') + '</span><span class="n">' + esc(r[1]) + '</span></button></li>').join('')
    : '<li style="padding:14px 4px;color:var(--mut)">لا توجد نتائج.</li>';
}
q.addEventListener('input', search);
q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lookup(q.value); } });
res.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { lookup(b.dataset.k); tag.scrollIntoView({block: 'nearest', behavior: 'smooth'}); } });

load();
}
</script>
</body>
</html>
